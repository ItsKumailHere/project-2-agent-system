[project]
name = "project-2-agent-system"
version = "0.1.0"
description = "Multi-Agent Research System using Swarm/OpenAI patterns"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "duckduckgo-search>=5.2.1",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.26.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
